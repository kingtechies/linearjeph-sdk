[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linearjeph"
version = "1.0.0"
description = "LINEARJEPH error tracking, performance, heartbeat and dependency reporting SDK (zero dependencies)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "LINEARJEPH" }]
keywords = ["error-tracking", "monitoring", "heartbeat", "performance", "linearjeph"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://linearjeph.cc"
Documentation = "https://linearjeph.cc/docs/sdk/python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linearjeph = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
